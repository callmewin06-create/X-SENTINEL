[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xsentinel"
version = "0.1.0"
description = "Reproducible per-input cross-view backdoor detection on EMBER2018"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "lightgbm==4.6.0", "scikit-learn==1.6.1", "scipy==1.17.1", "pandas==2.3.3", "streamlit==1.45.1", "lief==0.16.6"]

[project.scripts]
xsentinel = "xsentinel.cli:main"

[project.optional-dependencies]
plots = ["matplotlib==3.10.1", "contourpy==1.3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xsentinel = ["*_LICENSE.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
