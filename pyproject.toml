[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xsentinel"
version = "0.1.0"
description = "Reproducible per-input cross-view backdoor detection on EMBER2018"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==1.26.4", "lightgbm==4.6.0", "scikit-learn==1.6.1", "scipy==1.17.1", "pandas==2.3.3", "streamlit==1.45.1", "lief==0.16.6"]

[project.scripts]
xsentinel = "xsentinel.cli:main"

[project.optional-dependencies]
service = ["fastapi==0.115.12", "uvicorn==0.34.0", "SQLAlchemy==2.0.40", "alembic==1.15.2", "psycopg[binary]==3.2.6", "pydantic==2.11.1", "httpx==0.28.1"]
plots = ["matplotlib==3.10.1", "contourpy==1.3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xsentinel = ["*_LICENSE.txt", "pefile_warnings.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
